# X-gy MEASUREMENT ONLY -- branch measure/x-gy, opened as a DRAFT pull
# request that is never merged.  Replaces the real CI on this branch so each
# push runs only the matched A/B of bank_import:X-gy (ledger BI-496): the same
# slice of the suite under several cluster/worker arms, sequentially on ONE
# runner per replicate (tools/xgy_measure/run_all.sh).

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3]

    # Byte-for-byte today's lint-and-test service container: arms A12/A8/A4.
    services:
      postgres:
        image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: shekel_test
          POSTGRES_PASSWORD: shekel_test
          POSTGRES_DB: shekel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TZ: Pacific/Kiritimati

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Runner capacity
        run: |
          echo "XGY cores: $(nproc)"
          lscpu | sed 's/^/XGY lscpu /'
          free -h | sed 's/^/XGY free /'
          df -h / /tmp | sed 's/^/XGY df /'
          docker info --format 'XGY docker driver={{.Driver}} root={{.DockerRootDir}}'
          findmnt -no SOURCE,FSTYPE,OPTIONS / | sed 's/^/XGY mount root /'

      - name: CPU benchmark
        run: python tools/xgy_measure/cpu_bench.py 7 | sed 's/^/XGY /'

      - name: Prepare the service cluster exactly as ci.yml does
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://shekel_test:shekel_test@localhost:5432/postgres
        run: |
          python - <<'PY'
          import os
          import time

          import psycopg2

          GUCS = ("fsync", "full_page_writes", "synchronous_commit")
          DSN = os.environ["TEST_ADMIN_DATABASE_URL"]
          conn = psycopg2.connect(DSN)
          conn.autocommit = True
          with conn.cursor() as cur:
              for guc in GUCS:
                  cur.execute(f"ALTER SYSTEM SET {guc} = off")
              cur.execute("SELECT pg_reload_conf()")
          conn.close()
          deadline = time.monotonic() + 10
          while True:
              conn = psycopg2.connect(DSN)
              with conn.cursor() as cur:
                  cur.execute("SELECT name, setting FROM pg_settings WHERE name = ANY(%s)", (list(GUCS),))
                  applied = dict(cur.fetchall())
              conn.close()
              if all(v == "off" for v in applied.values()):
                  break
              if time.monotonic() > deadline:
                  raise SystemExit(f"GUCs did not apply: {applied}")
              time.sleep(0.2)
          print(f"XGY service cluster: {applied}")
          PY
          start=$(date +%s.%N)
          python scripts/build_test_template.py
          echo "XGY service template build: $(python3 -c "print(f'{$(date +%s.%N)-$start:.1f}')")s"
          python tools/xgy_measure/db_bench.py | sed 's/^/XGY DB service-tcp /'

      - name: Arms
        env:
          REPLICATE: ${{ matrix.replicate }}
        run: bash tools/xgy_measure/run_all.sh "${REPLICATE}"
