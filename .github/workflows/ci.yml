# Shekel Budget App -- Continuous Integration
#
# Eight jobs grade a pull request, and a ninth -- lint-and-test -- answers
# for the seven it needs (polyglot-lint is a required check of its own):
#
#   scope          classifies the change set: ``registry-only`` or ``full``
#                  (tools/ci/ci_scope.py; step 2b below), hands its two
#                  ends to commit-trailers, and names its pull request to
#                  landing.
#   commit-trailers  refuses a commit that breaks the card-trailer rules
#                  (tools/ci/commit_trailers.py), in EVERY scope (step 4d).
#   landing        refuses a merge writing a ship marker the one write rule
#                  forbids (tools/quill/landing.py), in EVERY scope (step 4e).
#   plan-gate      the plan gate, quill and tools/ci, in EVERY scope
#                  (step 4b).
#   tax-law        refuses from December 1 until next year's tax law is in
#                  the app, in EVERY scope (step 4c).
#   lint           every pylint floor and the checker tests (steps 5-5c),
#                  skipped when the scope is ``registry-only``.
#   test           the suite in six shards, each on its own runner through
#                  ``scripts/test.sh`` (steps 5d-7b), and the rehearsal kit's
#                  cluster tests on one of them (step 7c), skipped likewise.
#   polyglot-lint  the non-Python linters, in every scope (its own check).
#   lint-and-test  the check the ``dev`` and ``main`` rulesets require.  It
#                  NEEDS the first seven and runs ``if: always()``, because a
#                  SKIPPED required check counts as passing and a job that
#                  merely depended on a failed shard would be skipped --
#                  green.  tools/ci/ci_verdict.py judges every result.
#
# WHY SEVERAL JOBS AND NOT ONE (plan step bank_import:X-gy, ledger BI-496,
# rulings R-BI38..R-BI41).  One job ran for 41-61 min, 35-52 of them the
# suite, because the hosted runner is CPU-BOUND: 4 vCPUs that are 2 physical
# cores with SMT, each 1.2-2.1x slower than the developer's cores, under
# ``pytest.ini``'s ``-n 12``.  Measured 2026-09-22 in a matched A/B on the
# runner itself (draft PR #447, runs 35803297014, 35806759874, 35808935180):
# two or four postgres clusters per runner gained 0-7% over one, PGDATA on
# tmpfs 2-11%, and scripts/test.sh's cluster (socket, baked image, its flags)
# 8-15% over the TCP service container, while per-test wall clock scaled with
# the worker count.  More CPUs is the lever, so the suite is split across
# runners; six shards at ``-n logical`` ran 6.4-9.7 min each.
#
# THE STEP NUMBERS are kept from the single-job era, on the same steps, because
# .pre-commit-config.yaml, pytest.ini and tools/ci/ci_scope.py cite
# them.  Python matches the production Dockerfile (3.14) in every job.

name: CI

# ── Triggers ──────────────────────────────────────────────────────
# Run on pushes to main and on all pull requests.  An open PR (open it
# as a draft early for pre-merge feedback) runs this check on every
# push to its branch, and the rulesets on dev and main require that
# check green before merge.  ``push`` is intentionally NOT
# extended to dev: dev work is already covered by the pull_request
# trigger, and listing dev here double-runs CI (push + pull_request)
# on every PR'd dev push for zero added coverage.
#
# ``merge_group`` is what GitHub's merge queue runs the required checks on:
# since 2026-10-19 dev and main each take a change only through a queue
# (rulesets ``dev-queue`` and ``main-queue``, ruling R-BAL322), and each
# queued group is a change set of its own, classified and checked like a
# pull request.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# ── Token permissions ─────────────────────────────────────────────
# Least privilege: these jobs only check out code, install deps, and
# run pylint/pytest -- they need no write scope.  Dropping GITHUB_TOKEN
# to read-only bounds the blast radius of a compromised dev dependency
# running in the install/test steps.  docker-publish.yml scopes its own
# (broader) token separately.
permissions:
  contents: read

# ── The process clock, for every job ─────────────────────────────
env:
  # ── The process clock is skewed off the app's ON PURPOSE ──────
  # ``date.today()`` reads the PROCESS timezone; the app's civil day is
  # ``app.utils.dates.display_today()`` (America/New_York).  Production and
  # docker-compose.dev.yml both pin ``TZ: America/New_York``, so a test that
  # mixes the two passes everywhere a human runs it and fails only here --
  # and, before this line, only for the four hours a night UTC and Eastern
  # disagreed.  That is how three "flaky" tests reached main: each was a
  # deterministic failure with a four-hour window (2026-08-01).
  #
  # Kiritimati is UTC+14, so the process date runs a day ahead of the app's
  # for eighteen hours out of every twenty-four.  The coupling now fails on
  # most runs instead of a few, at no extra cost and with no second job.
  #
  # Do NOT "fix" a failure here by setting this to America/New_York.  That
  # hides the coupling rather than removing it, and the coupling is what
  # breaks the moment any environment differs.  The fix is always to use the
  # app's clock in the test -- see docs/testing-standards.md, "The ambient
  # clock and the ambient calendar".  Reproduce locally with:
  #     TZ=Pacific/Kiritimati ./scripts/test.sh
  TZ: Pacific/Kiritimati

# ── Jobs ──────────────────────────────────────────────────────────
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
      pull: ${{ steps.scope.outputs.pull }}
    steps:
      # The three-dot diff below reads history, so this checkout is full.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # tools/ci is standard-library only, so no install precedes it.
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # ── 2b. Classify the change set ──────────────────────────────
      # A registry pass -- the docs/plans commit that ticks a step, files
      # its findings and records its rulings -- is a pull request whose
      # only grader is the plan gate, and the registry lane is serialized
      # (one such PR at a time, each computed on the tree the last one
      # left), so the suite's runners and minutes spent on it sit on the
      # queue's critical path and grade nothing.  ``tools/ci/ci_scope.py``
      # answers ``registry-only`` when EVERY changed path is under
      # docs/plans, an arc document's directory (derived from
      # ``tools/ci/arcs.py``, not spelled here) or the plan gate's package,
      # and ``full`` for anything else, including an empty change set and
      # tools/ci itself: it fails CLOSED.
      # What makes the skip sound is the census that module keeps -- no
      # module in a skipped suite reads under those prefixes -- not that
      # every file there is graded; the polyglot-lint job still lints the
      # Markdown.  Every code-grading JOB (lint, test) is guarded
      # ``!= 'registry-only'``, so a missing output runs everything rather
      # than nothing; the plan gate (step 4b) is unguarded.  Approved by the
      # developer 2026-09-11 as its own PR; ``tools/ci/test_ci_workflow.py``
      # holds this wiring (split out of ``test_ci_scope.py`` at step X-cx's
      # L4), and that PR's body cites the runs that proved each scope.
      #
      # A pull_request event and a merge-queue group have a change set: a
      # push to main is a release and runs everything.  The step hands every
      # event's two ends -- a push's included, its before and after -- to the
      # commit-trailers job, and the pull request it judges -- a pull
      # request's number, or a queue group's branch, which ends with the
      # number of the one it merges -- to the landing job, so which payload
      # field holds them is read here and nowhere else.  The three-dot diff
      # is the branch's own changes since it forked from its base, so a ``git
      # merge origin/dev`` on the branch does not drag dev's files into the
      # set; --no-renames shows a rename as its old AND new path, so a file
      # renamed out of docs/plans is seen leaving.  Both SHAs are in the
      # fetch-depth-0 history; a diff that fails for any reason is reported
      # and answered ``full`` rather than trusted.
      - name: Classify the change set
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
              pull_request) BASE_SHA="${PR_BASE}" HEAD_SHA="${PR_HEAD}" PULL="${PR_NUMBER}" ;;
              merge_group) BASE_SHA="${GROUP_BASE}" HEAD_SHA="${GROUP_HEAD}" PULL="${GROUP_REF}" ;;
              push) BASE_SHA="${PUSH_BEFORE}" HEAD_SHA="${PUSH_AFTER}" PULL="" ;;
              *) BASE_SHA="" HEAD_SHA="" PULL="" ;;
          esac
          {
              echo "base=${BASE_SHA}"
              echo "head=${HEAD_SHA}"
              echo "pull=${PULL}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${EVENT_NAME}" != "pull_request" ] && [ "${EVENT_NAME}" != "merge_group" ]; then
              echo "scope=full" >> "${GITHUB_OUTPUT}"
              echo "scope: full (a ${EVENT_NAME} event has no pull-request change set)"
              exit 0
          fi
          if ! changed="$(git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}")"; then
              echo "scope=full" >> "${GITHUB_OUTPUT}"
              echo "scope: full (git diff ${BASE_SHA}...${HEAD_SHA} failed; not trusting an unreadable change set)"
              exit 0
          fi
          printf 'changed files:\n%s\n' "${changed}"
          scope="$(printf '%s\n' "${changed}" | python -m tools.ci.ci_scope)"
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
          echo "scope: ${scope}"

  commit-trailers:
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      # The undone commit a revert names can be anywhere in history, and the
      # stray rule reads origin/dev and origin/main, so this checkout is full;
      # the trailers are only READ.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # tools/ci is standard-library only, so no install precedes it.
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # ── 4d. The card-trailer rules, in EVERY scope ───────────────
      # Every commit of the change set (``base..head``, handed over by the
      # scope job) names a card as ``Ships: plan#N`` / ``Reopens: plan#N``
      # (or, until X-cx's cutover, ``<arc>:<id>``); a revert carries the
      # ``Reopens:`` or ``Ships:`` that keeps git's answer to "did plan#N
      # ship?" true to the code it removes or brings back (step X-cx's L4,
      # card plan#4); and a ``Reopens:`` on a commit neither dev nor main holds
      # yet undoes a ``Ships:`` in its own history (step X-cx's L9d, R-BAL309).
      # Git only, no tracker access.  A missing or partial range is a usage
      # error, never an empty change set: it fails, so the verdict is red.
      # Unguarded, like the plan gate: a registry-only pull request carries
      # commits too.  The rules: tools/ci/commit_trailers.py.
      - name: Card trailers (every scope)
        env:
          BASE_SHA: ${{ needs.scope.outputs.base }}
          HEAD_SHA: ${{ needs.scope.outputs.head }}
        run: python -m tools.ci.commit_trailers "${BASE_SHA}" "${HEAD_SHA}"

  landing:
    needs: scope
    runs-on: ubuntu-24.04
    # The job's own token reads the pull request it judges (its base, head
    # branch and head commit), so this job alone adds ``pull-requests: read``
    # to the workflow's least privilege.  A job's permissions replace the
    # workflow's, so ``contents: read`` is restated for the checkout.
    permissions:
      contents: read
      pull-requests: read
    env:
      # Whether this run was handed the reader App's key at all: GitHub
      # documents that a Dependabot run and a fork's pull request get no
      # Actions secrets.  A boolean only -- the key itself never enters the
      # job's env.
      # It decides the mint step alone; whether the tracker must be read is
      # tools/quill/landing.py's to decide, and with no token it refuses to
      # judge a change that records a card (exit 2), so a skipped mint never
      # turns a needed read green.
      PLAN_READER_KEY_PRESENT: ${{ secrets.PLAN_READER_KEY != '' }}
    steps:
      # The check reads the merge it judges beside the whole history of dev
      # and main -- the lines each branch took in and the commits that took
      # them, every card either ever marked, and what will have shipped once
      # the merge and the other branch meet -- so this checkout is full; the
      # history is only READ.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # This job holds a token, so it runs the least third-party code it can:
      # the two packages the check imports (``requests``, and ``cryptography``
      # through quill's GitHub client), at the versions requirements.txt pins
      # -- read from that file, their one home -- and no pip upgrade.  (A
      # constraints file cannot be used: pip refuses one holding extras, and
      # requirements.txt has two.)  A package the check comes to import
      # beyond these fails the job red.
      - name: Install dependencies
        run: |
          set -euo pipefail
          grep -E '^(requests|cryptography)==' requirements.txt > "${RUNNER_TEMP}/landing-requirements.txt"
          python -m pip install -r "${RUNNER_TEMP}/landing-requirements.txt"

      # The tracker's owner and repository, from quill's PLAN
      # (tools/quill/setup_tracker.py), their one home: the mint reads them
      # from this step rather than spelling them.
      - name: Read the tracker's place
        id: plan
        run: |
          set -euo pipefail
          python - >> "${GITHUB_OUTPUT}" <<'EOF'
          from tools.quill.setup_tracker import PLAN
          print(f"owner={PLAN.owner}")
          print(f"name={PLAN.name}")
          EOF

      # ── 4e. The one write rule over ship markers, in EVERY scope ─
      # Ruling balance:R-BAL289 (CI reads the tracker with a read-only token)
      # as balance:R-BAL311 makes it: the read-only App "Shekel plan reader"
      # (Issues read-only, installed on the tracker only), its private key in
      # the PLAN_READER_KEY secret and its Client ID in the
      # PLAN_READER_CLIENT_ID variable.  GitHub's own action mints an
      # installation token for this run, narrowed again here to reading
      # issues of that one repository, and revokes it when the job ends
      # (GitHub expires one within the hour in any case).
      # Only the check step is handed the token in its env, and only the mint
      # is handed the key, as an input, which the runner puts in the
      # environment (INPUT_PRIVATE-KEY) of that step and of its post step (the
      # action's dist/post.cjs, which reads its inputs and revokes the token
      # when the job ends); but the key is in the runner's memory for the whole
      # job, so this narrows what a leak from the job yields and does not close
      # it.
      - name: Mint the tracker read token
        id: token
        if: env.PLAN_READER_KEY_PRESENT == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PLAN_READER_CLIENT_ID }}
          private-key: ${{ secrets.PLAN_READER_KEY }}
          owner: ${{ steps.plan.outputs.owner }}
          repositories: ${{ steps.plan.outputs.name }}
          permission-issues: read

      # Which change may add, change or delete a card's ship marker
      # ``plan/ships/N`` (ruling balance:R-BAL359; step X-cx's M2): the merge
      # this run checked out (``github.sha``: a pull request's trial merge,
      # or the commit a queue group's target becomes) is judged as the change
      # it makes to its first parent, the target's tip, for the ONE pull
      # request the scope job names.  The job's own token reads that pull
      # request's base, head branch and head commit, and a merge whose second
      # parent is not that head is not judged (exit 2).  A push to main was
      # judged in main's queue, its only way in (R-BAL322), so the check says
      # so and exits 0.  The tracker is read only when a card the change
      # records must be.  No condition: with the mint skipped the token is
      # empty, and the check decides.
      # The rules: tools/quill/landing.py.
      - name: Ship markers against the write rule (every scope)
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          PULL: ${{ needs.scope.outputs.pull }}
          PLAN_READ_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.quill.landing "${EVENT_NAME}" "${MERGE_SHA}" "${PULL}"

  plan-gate:
    runs-on: ubuntu-24.04
    steps:
      # ── 1. Check out the repository ──────────────────────────────
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan gate's git arms (tools/plan_gate/_shipped.py) READ this
          # history: they resolve every SHIPPED step's commit and refuse an
          # open leaf that a commit on this tree says it shipped.  The default
          # depth-1 checkout makes both arms blind, and rule 7's hash arm used
          # to grade a hash's FORM only for exactly that reason -- "a gate that
          # passes on nothing".  ``test_shipped_against_git`` asserts the
          # history IS gradeable, so removing this line fails the suite loudly
          # instead of silently switching two arms off.
          fetch-depth: 0
          # The arms only READ local history, so the GITHUB_TOKEN still need
          # not persist in .git/config.  Avoids the credential-persistence
          # vector (zizmor artipacked).
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ── 4b. The plan gate, in EVERY scope ────────────────────────
      # The one grader a registry-only pull request has, so it is a job of
      # its own with no guard, running beside lint and the shards rather than
      # ahead of them.  The package's 10.00/10 pylint floor was enforced by
      # pre-commit alone until 2026-09-11 (its hook comment says so); a
      # registry-only run that edits the gate would otherwise merge unlinted,
      # so the floor is held here too, in both scopes.  ``yaml`` (PyYAML,
      # pinned in requirements-dev.txt) is what ``tools/ci/test_ci_workflow.py``
      # reads THIS file with, which is why the step follows the install.
      #
      # Quill (tools/quill/: the private tracker's setup, and from
      # step X-cx's leaf L2 the ``quill`` command; ruling balance:R-BAL170) is
      # graded in the same step, at the same floor, in every scope.  Its tests
      # never call GitHub and take under a second, and a test of the tool that
      # will READ the registries (the migration, L7) must not be skipped by a
      # registry-only change set, which the lint job would do.
      #
      # ``tools/ci`` (this workflow's classifier and verdict, and the arc
      # list the gate and the tool read; step X-cx's L4) is graded here too.
      # A change to it is never registry-only, but every registry pass RUNS
      # its classifier, so its tests are not left to the scope they grade.
      #
      # ``tools/release`` (what a release carries; step X-cx's L9a) reads
      # steps.md as each commit holds it until the cutover, so, like quill's,
      # its tests run in every scope rather than being skipped by a
      # registry-only change set.
      #
      # ``tools/split`` (the proved test-file split; step balance:X-er, ruling
      # R-BAL301) reads no registry.  It is graded here beside the other tools
      # packages, at the same floor, so every tools package holds one floor in
      # one step; a change to it is still ``full`` (it is no registry-only
      # prefix), which ``tools/ci/test_ci_scope.py`` holds.
      #
      # ``tools/rehearsal`` (the release rehearsal kit; step X-cx's K1, rulings
      # R-BAL314 and R-BAL315) reads no registry either, and holds the same
      # floor here.  Its tests that start a real private cluster carry the
      # ``cluster`` marker and are deselected: a registry-only change set
      # cannot change the kit, so a cluster here would grade nothing new (the
      # coordinator's K1 leaf-plan ruling, item 3).  They run in the test job,
      # step 7c.
      - name: Plan gate (every scope)
        run: |
          pylint tools/plan_gate/ --fail-under=10 --fail-on=E,F --output-format=colorized
          pytest tools/plan_gate -c /dev/null -q
          pylint tools/quill/ --fail-under=10 --fail-on=E,F --output-format=colorized
          pytest tools/quill -c /dev/null -q
          pylint tools/ci/ --fail-under=10 --fail-on=E,F --output-format=colorized
          pytest tools/ci -c /dev/null -q
          pylint tools/release/ --fail-under=10 --fail-on=E,F --output-format=colorized
          pytest tools/release -c /dev/null -q
          pylint tools/split/ --fail-under=10 --fail-on=E,F --output-format=colorized
          pytest tools/split -c /dev/null -q
          pylint tools/rehearsal/ --fail-under=10 --fail-on=E,F --output-format=colorized
          pytest tools/rehearsal -c /dev/null -q -m "not cluster"

  tax-law:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Its OWN key: this job installs the runtime requirements only, and a
      # cache saved under the key the other jobs share would lack every dev
      # wheel -- and a saved key is never overwritten, so each of them would
      # re-download those until the requirements next changed.
      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-runtime-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-runtime-

      # The runtime requirements only: importing the law imports the ``app``
      # package, and the check needs nothing the dev tools add.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4c. Next year's tax law, in EVERY scope ──────────────────
      # From December 1 this job fails every pull request -- a release to
      # main, a dev PR, a registry-only tick or a Dependabot bump alike --
      # until next year's tax law is in app/tax_law/ (plan step
      # salary:X-at-4; rulings salary:R-SAL74, R-SAL86: the year, listing
      # every state an earlier year lists).  Unguarded, like the plan gate,
      # because the ruling refuses EVERY release and a registry-only PR is
      # one.  It reads the REAL clock, in the display timezone, so the TZ skew
      # above cannot move it and the calendar sweep's faked date never
      # reaches it.  It is judged when the PR is pushed, and again on the
      # merge-queue group that lands it: dev and main each take a change only
      # through a queue (R-BAL322), and this workflow runs on every group, a
      # release into main's included (measured 2026-10-23: main's one queued
      # run so far, 39463907960 for release PR #587, ran this job's refuse
      # check, as dev's groups do).  A group is judged before it lands (that
      # one at 17:11 UTC, landed 17:24 UTC on 2026-10-20), so a group judged
      # green on November 30 can still land in December.  Such a group into
      # main -- and a tag, which skips PRs -- is what the same check in
      # docker-publish.yml stops, before the release image is built.  The banner on every owner
      # page and the weekly tax-law.yml run give the month's warning before
      # either refuses.
      - name: Is next year's tax law in? (refuses from December 1)
        run: python scripts/check_tax_law.py refuse

  lint:
    needs: scope
    if: needs.scope.outputs.scope != 'registry-only'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ── 5. Run pylint ────────────────────────────────────────────
      # Layered pylint gate:
      #   --fail-on=E,F,shekel-decimal-from-float,shekel-refname-compare,shekel-bare-money-quantize,shekel-disable-rationale,shekel-transaction-status-bypass,shekel-ledger-model-bypass,shekel-unclassified-fenced-export,shekel-private-module-import:
      #     always fail on errors (E), fatals (F), and the project's custom
      #     checkers (tools/pylint/shekel_checkers/, loaded via .pylintrc) --
      #     the financial-correctness rules (decimal-from-float, refname-compare,
      #     bare-money-quantize), disable-rationale
      #     (every `# pylint: disable=` must carry a standard `Pylint:`
      #     why-comment),
      #     transaction-status-bypass (every Transaction.status_id change must go
      #     through the transaction_service.apply_status_change seam),
      #     ledger-model-bypass (every posted-ledger model import must stay
      #     inside the posting-ledger services), and private-module-import
      #     (a package's private modules are private: no module may import
      #     another package's _module, nor any name from it -- the balance
      #     arc's D-gate) -- even if
      #     the score stays above the threshold.  These have zero violations
      #     today, so this only ever catches a regression -- it cannot turn the
      #     current green build red.
      #   --fail-under=10: the cleanup lock-in (docs/audits/pylint-cleanup/plan.md
      #     Phase 5).  app/ is at a clean 10.00/10, so any new convention/warning
      #     that drops the score fails the build.  Enforced locally by the Stop
      #     hook via the scripts/hooks/ENFORCE_PYLINT_FLOOR sentinel.
      - name: Lint with pylint
        run: pylint app/ --fail-under=10 --fail-on=E,F,shekel-decimal-from-float,shekel-refname-compare,shekel-bare-money-quantize,shekel-disable-rationale,shekel-transaction-status-bypass,shekel-ledger-model-bypass,shekel-unclassified-fenced-export,shekel-private-module-import --output-format=colorized

      # ── 5a. Lint scripts/ ────────────────────────────────────────
      # Same layered gate for the operational CLI scripts.  scripts/
      # reached 10.00/10 on 2026-06-11 (docs/audits/pylint-cleanup/
      # plan.md Phase 5 step 5); without this step nothing in CI stops
      # a merge from regressing it -- the per-edit hooks only cover
      # local edits.  Linted as a separate invocation (per-tree floor):
      # whether the COMBINED `pylint app/ scripts/` run should also
      # gate cross-tree duplicate-code is a separate open decision in
      # docs/audits/pylint-cleanup/deep-quality-hunt.md.
      - name: Lint scripts with pylint
        run: pylint scripts/ --fail-under=10 --fail-on=E,F,shekel-decimal-from-float,shekel-refname-compare,shekel-bare-money-quantize,shekel-disable-rationale,shekel-transaction-status-bypass,shekel-ledger-model-bypass,shekel-unclassified-fenced-export,shekel-private-module-import --output-format=colorized

      # ── 5a2. Lint the pylint checker package ─────────────────────
      # The custom checkers ARE the enforcement machinery, so they hold the
      # same 10.00/10 floor they impose on app/ and scripts/.  This gate is
      # what stops a checker edit from silently regressing the plugin: the R3
      # status-fence extension had left it at 9.54 until the R10 package split
      # (docs/audits/balance_architecture/).  Scoped to the shekel_checkers/
      # package only -- the tests/ subtree is out of general pylint scope
      # (ratified decision #1) and is covered by the pytest run in step 5b.
      - name: Lint checker package with pylint
        run: pylint tools/pylint/shekel_checkers/ --fail-under=10 --fail-on=E,F,shekel-decimal-from-float,shekel-refname-compare,shekel-bare-money-quantize,shekel-disable-rationale,shekel-transaction-status-bypass,shekel-ledger-model-bypass,shekel-unclassified-fenced-export,shekel-private-module-import --output-format=colorized

      # ── 5a3. Lint the manual verification harnesses (E/F only) ───
      # `tests/manual/` holds the proof instruments every cutover in the
      # planning arcs is verified with -- run by hand against a production
      # CLONE, before and after, and diffed.  Nothing held them to the code
      # they measure: pytest does not collect the directory, and every probe
      # wraps itself in a `_guard` that records a raise AS DATA, so a
      # signature change turns a harness into a file that dumps
      # {"RAISED": ...} where a figure belongs -- and a before/after diff of
      # two such runs reads BYTE-IDENTICAL over a region never measured.
      # Measured 2026-08-18 (ledger row P66): FOUR call sites were already
      # dead, one of them since plan step C2-f2d-3, whose own baseline
      # harness had been reporting a TypeError where the retirement figures
      # belong.
      #
      # E/F ONLY, deliberately, and NOT the 10.00/10 floor the three trees
      # above hold: these are hand-run scripts that legitimately duplicate
      # each other (R0801) and legitimately branch wide (R0911).  What this
      # gate catches is exactly the class that rotted them -- a call to a
      # function that no longer exists, or no longer takes those arguments.
      # A both-sides harness that must name a HEAD-only API carries a scoped
      # disable with a `Pylint:` rationale (verify_retirement_render.py).
      - name: Lint verification harnesses with pylint
        run: pylint tests/manual/ --fail-on=E,F --disable=all --enable=E,F --output-format=colorized

      # ── 5b. Custom-checker unit tests + tests/ Decimal scan ──────
      # The checkers themselves are unit-tested (every "flags" case paired with a
      # "must-not-flag" case). tests/ are out of general pylint scope, but a
      # float-sourced Decimal in a hand-computed assertion is a real bug, so the
      # one monetary-precision checker is applied there too. unknown/bad-option-value
      # are disabled explicitly (--disable=all does not cover option-validity
      # meta-messages) so the test files' "disable=X -- explanation" inline
      # comments do not derail this targeted scan.
      - name: Test and apply custom pylint checkers
        run: |
          pytest tools/pylint/tests -c /dev/null -q
          pylint tests/ --disable=all --enable=shekel-decimal-from-float --disable=unknown-option-value,bad-option-value --output-format=colorized

      # ── 5c. Cross-tree duplicate-code (app/ + scripts/ combined) ─
      # R0801 is computed over the linted set, so the per-tree runs in
      # steps 5 and 5a can never see an app/-to-scripts/ copy -- the
      # drift class behind the MFA-clear and seed-vs-register
      # duplications consolidated on 2026-06-11.  This combined run
      # enables ONLY duplicate-code; everything else is already
      # enforced per tree.  Verified to detect the historical clusters
      # (the pre-consolidation commit fails this exact invocation) and
      # to pass on the consolidated tree.
      - name: Cross-tree duplicate-code (pylint app/ + scripts/)
        run: pylint app/ scripts/ --disable=all --enable=duplicate-code --disable=unknown-option-value,bad-option-value --output-format=colorized

  test:
    needs: scope
    if: needs.scope.outputs.scope != 'registry-only'
    runs-on: ubuntu-24.04
    strategy:
      # One red shard must not cancel the others: a failing merge gate should
      # report every failure it has, not the first shard's.
      fail-fast: false
      matrix:
        # SIX SHARDS (ruling R-BI39).  This list is the count the jobs READ:
        # each takes its share as ``strategy.job-index`` of
        # ``strategy.job-total``, so an entry added here re-splits the suite
        # with no other edit.  (The ruling's number is also pinned by
        # tests/test_arch/test_the_shards_partition_the_suite.py and named in
        # the prose that cites R-BI39.)  The labels are the 0-based indexes,
        # so a check named ``test (0)`` runs shard 0.
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      # Depth 2, not the default 1: step 7c's bench case checks out ``HEAD~1``
      # as its base state, and a depth-1 clone does not hold that commit.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ── 5d. Record the runner's capacity ─────────────────────────
      # The hosted fleet is not one machine: the X-gy measurement drew AMD
      # EPYC 7763, 9V74 and 9V45 and an Intel Xeon 6973P, the slowest
      # running a fixed CPU benchmark 1.8x slower than the fastest.  A shard
      # that ran long is first a question of which CPU it drew, so the model
      # is printed beside the core count.
      - name: Record runner capacity
        run: |
          echo "cores: $(nproc)"
          lscpu | grep 'Model name' || echo "Model name: (not reported)"
          free -h
          df -h /

      # ── 7. Run this shard of the suite ───────────────────────────
      # ``scripts/test.sh`` gives the run a private postgres cluster from the
      # baked template image -- the SAME cluster, flags and timeouts every
      # local run gets (ruling R-BI40), where a service container here once
      # carried a second configuration with ``lock_timeout`` off.  ``CI`` is
      # set on the runner, which is what sanctions the wrapper using the
      # runner's own throwaway daemon.
      #
      # ``SHEKEL_TEST_SHARD`` is read by ``tests/conftest.py``: the job keeps
      # the tests ``tests/_shard.py`` assigns it, a partition by construction
      # that keeps every ``xdist_group`` whole.  ``-m ""`` overrides the
      # wrapper's local ``not docker`` default, so the container-spawning
      # ``tests/test_deploy`` tests run here as they always have.
      #
      # ``-n logical`` is the runner's logical CPU count, 4 today -- ``auto``
      # would drop to the PHYSICAL count (2) the day psutil is installed.
      # Measured 2026-09-22 on the runner, one 1,230-test slice through this
      # wrapper: -n 4 took 0.88-0.91 of -n 12's time (0.77-0.81 of the old
      # service container at -n 12, the two changes together), and -n 3 and
      # -n 6 were slower than -n 4.  The workers and the database shared four
      # starved vCPUs; oversubscription stretched each test's wall clock,
      # which is what the per-test timeout measures, and bought no
      # throughput.  ``pytest.ini``'s ``-n 12`` stays the local default.
      #
      # ``--durations=25``: the ``-q`` here overrides ``pytest.ini``'s ``-v``,
      # so without it a green run publishes no per-test timing at all, and a
      # test creeping toward its timeout would be invisible until the run it
      # finally blew.  Each shard prints its own 25 slowest, pass or fail.
      - name: Run tests
        env:
          SHEKEL_TEST_SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
        run: ./scripts/test.sh -n logical -m "" --tb=short -q --durations=25

      # ── 7b. Audit-trigger overhead REPORT, SERIALLY ──────────────
      # ``tests/test_performance`` is excluded from step 7 by
      # ``pytest.ini``'s ``--ignore``, and until 2026-08-28 that meant
      # it ran NOWHERE: its five tests had errored at setup since
      # 2026-05-20 (commit 8368cd57 pointed the fixture at
      # ``account_service.create_account``, which refuses an owner with
      # no pay periods, while the fixture that creates them runs after
      # it) and no local run, no wrapper run and no CI run reported a
      # thing.  Same directory-is-invisible mechanism as the
      # ``tests/manual/`` rot that step 5a3 answers.
      #
      # Since plan step balance:X-cy these tests PRINT the audit
      # trigger's overhead (past pytest's capture, so a passing run shows
      # it) and no assertion reads a time (ruling R-BAL144): wall-clock
      # ceilings here failed the required check four times in ~14 hours
      # on shared runners with no change to the trigger (finding
      # REC-533).  What the trigger DOES is graded in step 7 instead, by
      # tests/test_integration/test_audit_trigger_work.py.  The step
      # stays GRADED (R-BAL152): a benchmark that raises still fails it,
      # because the silent rot above is what an ungraded step would allow
      # again, and so does one that hangs past the suite's 50 s per-test
      # timeout (R-BAL153).
      #
      # It gets its own invocation rather than joining step 7 because the
      # ratio it prints is destroyed by oversubscription.  Measured
      # 2026-08-28, identical tree, same five tests: serially the
      # regenerate benchmark reads 0.8-3.0% overhead; under ``-n 12`` it
      # reads 24.3-26.6%.  That workload wrote no audit row at all (found
      # at X-cy), so the whole 25-point gap is contention: a wrong number
      # to print.
      #
      # ONE shard runs them, after its own suite has finished, so the runner
      # is otherwise idle.  ``--override-ini=addopts=`` drops the whole
      # default addopts line (which is what carries the ``--ignore`` and
      # ``-n 12``); ``-n 0`` then runs them in-process, the only condition
      # under which the numbers mean anything.
      - name: Run audit-trigger benchmarks (serial)
        if: strategy.job-index == 0
        run: ./scripts/test.sh tests/test_performance -q -n 0 -p no:randomly --override-ini=addopts=

      # ── 7c. The rehearsal kit's cluster tests, on ONE shard ──────
      # ``tools/rehearsal``'s ``cluster`` tests start a real private cluster
      # from the image step 7 built or verified, and dump and restore with the
      # IMAGE's own ``pg_dump`` and ``pg_restore``, run inside the cluster's
      # container, so the runner needs no PostgreSQL tools (ruling
      # balance:R-BAL327).  The plan gate's step deselects them, since a
      # registry-only change set cannot change the kit; here they run in the
      # full scope.  ``CI`` sanctions the runner's own daemon, as in step 7.
      #
      # Shard 3 because it had the lowest mean wall time of the six over the
      # six newest green runs (449-693 s, against 704-742 s for shard 0, which
      # carries step 7b), measured 2026-10-20.  The bench case's base state is
      # ``HEAD~1``: hence the checkout's depth of 2.
      - name: Run the rehearsal kit's cluster tests (shard 3)
        if: strategy.job-index == 3
        run: pytest tools/rehearsal -c /dev/null -q -m cluster

  lint-and-test:
    needs: [scope, commit-trailers, landing, plan-gate, tax-law, lint, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The verdict, fail-closed: every grader succeeded, or -- only when the
      # scope is exactly ``registry-only`` -- lint and the shards were
      # skipped.  A failed, cancelled or wrongly skipped job, a job the
      # verdict does not know, or one missing from ``needs`` is red.  The
      # rules and why each exists: tools/ci/ci_verdict.py.
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "${NEEDS}" | python -m tools.ci.ci_verdict

  # ── Polyglot linters ──────────────────────────────────────────────
  # Non-Python lint floors adopted in docs/audits/polyglot-cleanup
  # (shell, JS/CSS, Jinja templates, workflows, Dockerfile, YAML,
  # secrets, spelling). Mirrors the local .pre-commit-config.yaml hooks.
  # Binary tools are pinned by version and downloaded (no extra
  # third-party actions to SHA-pin); the pip tools (yamllint, zizmor,
  # djlint) come from requirements-dev.txt. Each tool reads its own
  # in-repo config file. The dev and main rulesets require it beside
  # lint-and-test, so the floor blocks merges.
  polyglot-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # pip-installable linters (yamllint, zizmor, djlint) + jinja2 for the
      # template parse check, all pinned in requirements-dev.txt.
      - name: Install pip linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Version-pinned standalone binaries, extracted to ~/.local/bin via
      # `find` so a change in an archive's internal layout cannot break the
      # step. shellcheck is pinned to 0.11.0 specifically: the optional
      # masked-errexit groups in .shellcheckrc need >= 0.10 and the runner's
      # preinstalled build may lag.
      - name: Install pinned binary linters
        run: |
          set -euo pipefail
          bin="${HOME}/.local/bin"
          mkdir -p "${bin}"
          echo "${bin}" >> "${GITHUB_PATH}"
          tmp="$(mktemp -d)"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJf - -C "${tmp}"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xzf - -C "${tmp}"
          curl -fsSL https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz | tar -xzf - -C "${tmp}"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xzf - -C "${tmp}"
          curl -fsSL -o "${tmp}/shfmt" https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          curl -fsSL -o "${tmp}/biome" "https://github.com/biomejs/biome/releases/download/@biomejs/biome@2.5.14/biome-linux-x64"
          curl -fsSL -o "${tmp}/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          for t in shellcheck actionlint typos gitleaks; do
              install -m 0755 "$(find "${tmp}" -type f -name "${t}" | head -1)" "${bin}/${t}"
          done
          install -m 0755 "${tmp}/shfmt" "${bin}/shfmt"
          install -m 0755 "${tmp}/biome" "${bin}/biome"
          install -m 0755 "${tmp}/hadolint" "${bin}/hadolint"

      - name: shellcheck (shell)
        run: git ls-files -z '*.sh' 'entrypoint.sh' | xargs -0 -r shellcheck

      - name: shfmt (shell format check)
        run: git ls-files -z '*.sh' 'entrypoint.sh' | xargs -0 -r shfmt -d -i 4 -ci -bn

      - name: yamllint
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 -r yamllint

      - name: actionlint (GitHub workflows)
        run: actionlint

      - name: zizmor (workflow security)
        env:
          GH_TOKEN: ${{ github.token }}
        # The whole .github/ tree: dependabot.yml is audited too.
        run: zizmor .github/

      - name: biome (JS + CSS)
        run: biome lint app/static/js app/static/css

      - name: hadolint (Dockerfile)
        run: hadolint Dockerfile

      - name: gitleaks (committed-secret scan)
        run: gitleaks dir . --no-banner --redact

      - name: typos (content spell check)
        run: typos

      - name: djlint (Jinja templates, lint-only)
        run: djlint app/templates/ --lint

      - name: jinja2 template parse check
        run: python scripts/check_template_syntax.py

      - name: rumdl (Markdown lint + format check)
        run: rumdl check

      - name: docker compose schema validation
        run: |
          for f in docker-compose.yml docker-compose.dev.yml docker-compose.build.yml; do
              docker compose -f "${f}" config --no-interpolate -q
          done
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config --no-interpolate -q
