# Build and publish Shekel Docker image to GitHub Container Registry.
#
# Triggers:
#   - Push to main → tags as "latest"
#   - Git tag v* → tags as version + "latest"
#
# Audit Commit C-36 (findings F-060, F-155):
#   - Image is digest-pinned downstream by deploy/docker-compose.prod.yml
#     (the workflow output below carries the digest the operator pastes
#     into SHEKEL_IMAGE_DIGEST in /opt/docker/shekel/.env).
#   - Image is signed with Cosign keyless OIDC after every successful
#     push.  The signature is uploaded to GHCR alongside the image and
#     can be verified with:
#         cosign verify \
#             --certificate-identity-regexp \
#             "https://github.com/SaltyReformed/Shekel/.github/workflows/docker-publish.yml@.*" \
#             --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#             ghcr.io/saltyreformed/shekel@sha256:<digest>

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Pin Cosign to the GitHub-Actions-installer's matching version so
  # an unexpected upstream API change cannot silently break signing
  # in steady state.  Update this in the same commit as any cosign
  # CLI flag change.
  #
  # Bumped 2026-05-14 from v2.6.4 (no longer downloadable -- the 2.x
  # release line was pruned from sigstore's distribution channel,
  # causing back-to-back "Install Cosign" failures on 2026-05-13 and
  # 2026-05-14 runs).  v3.x is the current major; the sign + verify
  # CLI surface used here (cosign sign / cosign verify with
  # --certificate-identity-regexp + --certificate-oidc-issuer) is
  # backward-compatible with v2.x, so the operator-side verify
  # commands in deploy/README.md continue to work unchanged.
  COSIGN_VERSION: v3.0.6

jobs:
  # ── Next year's tax law, before any image is built ──────────────
  # From December 1 no release image is built until next year's tax law is
  # in app/tax_law/ (plan step salary:X-at-4; rulings salary:R-SAL74,
  # R-SAL86, R-SAL88).  ci.yml's ``tax-law`` job refuses the same thing on a
  # pull request, but GitHub judges that when the PR is pushed and does not
  # re-run it at merge: a release PR checked green on November 30 could merge
  # on December 2, and a v* tag skips pull requests altogether.  This check is
  # judged when the release is BUILT, so neither can ship one.  A December
  # merge without next year leaves production on the previous image until the
  # law is added (R-SAL88); the code on main runs ahead of it meanwhile.
  #
  # "Re-run failed jobs" re-runs only the build and REUSES this job's result,
  # so a check that passed on November 28 would otherwise wave through a
  # build re-run on December 3.  So this job also hands the build the instant
  # the refusal starts for the law it checked (``refuse_from``), and the
  # build's first step refuses once that instant has passed.  The date rule
  # and the timezone stay in Python; the build compares two integers.
  #
  # Its OWN job, with read-only permissions, rather than a step of the build:
  # installing the requirements runs third-party install code, and the build
  # job holds ``id-token: write`` (it signs images) and ``packages: write``.
  # ``build-and-push`` NEEDS this job, so a failure here builds nothing.
  tax-law:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      refuse_from: ${{ steps.refuse_from.outputs.epoch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The runtime requirements only: importing the law imports the ``app``
      # package, and the check needs nothing the dev tools add.  No pip cache:
      # a cache restored into a release workflow is a way to poison it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The real clock, in the display timezone: fails from December 1 while
      # next year is missing (scripts/check_tax_law.py).
      - name: Is next year's tax law in? (refuses from December 1)
        run: python scripts/check_tax_law.py refuse

      # The Unix time this law's refusal starts (midnight Eastern), for the
      # build's own check below.  An assignment, so a failing script fails
      # the step rather than handing the build an empty value.
      - name: When does the refusal start?
        id: refuse_from
        run: |
          epoch="$(python scripts/check_tax_law.py refuse --starts-epoch)"
          echo "epoch=${epoch}" >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: tax-law
    runs-on: ubuntu-latest
    permissions:
      # ``id-token: write`` is required for sigstore keyless signing
      # via OIDC (the Action mints a short-lived OIDC token from the
      # GitHub provider, which Fulcio exchanges for an X.509
      # signing certificate).  Without this scope, ``cosign sign``
      # fails with a 403 from the OIDC token endpoint.
      id-token: write
      contents: read
      packages: write

    steps:
      # FIRST, before any checkout or login: refuse once the tax-law refusal
      # has started, even when this job is a re-run whose ``tax-law`` result
      # was judged before it (R-SAL88).  A missing or malformed value refuses
      # too -- a check that handed nothing has vouched for nothing.
      - name: Is it still before the tax-law refusal?
        env:
          REFUSE_FROM: ${{ needs.tax-law.outputs.refuse_from }}
        run: |
          set -euo pipefail
          if ! [[ "${REFUSE_FROM}" =~ ^[0-9]+$ ]]; then
              echo "The tax-law check handed no refusal time; refusing to build." >&2
              exit 1
          fi
          now="$(date +%s)"
          if [ "${now}" -ge "${REFUSE_FROM}" ]; then
              echo "The tax-law refusal started at ${REFUSE_FROM} (Unix time) and it is ${now}." >&2
              echo "Next year's tax law is missing: add it, then re-run ALL jobs." >&2
              exit 1
          fi
          echo "Before the tax-law refusal (${now} < ${REFUSE_FROM})."

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build, push, and sign steps authenticate via docker
          # login and OIDC, not git, so the checkout token need not
          # persist in .git/config (zizmor artipacked hardening).
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        # sigstore/cosign-installer pins a specific cosign version on
        # the runner.  The same cosign version then runs both the
        # ``sign`` step below and any operator-side ``verify``, so
        # signature-format compatibility is a known constant.
        #
        # Bumped 2026-05-14 from v3.7.0 (which only supports cosign
        # 2.x) to v4.1.2 (cosign 3.x).  The 2.x releases were pruned
        # from sigstore's distribution channel; pinning to a 2.x
        # version under v3.7.0 of this Action fails at download.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        # ``id`` lets the next step reference ``steps.build.outputs.digest``
        # -- the immutable sha256 digest of the manifest just pushed.
        # We sign by digest (cosign best practice; signing by tag
        # would let a future tag-swap detach the signature from the
        # image bytes it attests to).
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with Cosign (keyless OIDC)
        # ``cosign sign`` with no ``--key`` uses the sigstore keyless
        # flow: the workflow's OIDC identity is exchanged for a
        # short-lived Fulcio cert, which signs the image, and the
        # signature is uploaded to the registry.  ``--yes`` skips
        # the interactive confirmation prompt that would otherwise
        # block CI.
        #
        # We sign every tag the metadata action produced.  Each ``sign``
        # invocation works against the digest, so the multi-tag fanout
        # records one signature per (tag, digest) pair.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "Signing ${tag}@${DIGEST}"
              cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      - name: Emit image digest for downstream pinning
        # Print the digest in a discoverable spot so the operator can
        # paste it into /opt/docker/shekel/.env's SHEKEL_IMAGE_DIGEST
        # variable.  Also write it to the workflow summary so the
        # latest digest is one click away from the Actions UI.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Image digest: ${DIGEST}"
          {
              echo "## Image digest"
              echo ""
              echo "Pin this digest in \`/opt/docker/shekel/.env\`:"
              echo ""
              echo "\`\`\`"
              echo "SHEKEL_IMAGE_DIGEST=${DIGEST}"
              echo "\`\`\`"
              echo ""
              echo "Verify with:"
              echo ""
              echo "\`\`\`"
              echo "cosign verify \\"
              echo "    --certificate-identity-regexp \\"
              echo "    \"https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml@.*\" \\"
              echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
              echo "    ghcr.io/${{ github.repository }}@${DIGEST}"
              echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
