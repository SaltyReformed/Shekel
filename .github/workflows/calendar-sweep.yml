# Shekel Budget App -- Calendar sweep
#
# Runs the full test suite as if today were each of several awkward
# calendar positions, so a test that only breaks on one of them is found
# by this job rather than by a merge gate on the morning it fires.
#
# WHY THIS EXISTS.  Five separate defects in this suite had exactly one
# trigger -- the day it happened to run on -- and every one of them was
# found by CI blocking a merge, never by a test:
#
#   * N-131  six cross-page tests failed on the last days of a month;
#   * N-132  fixtures separated events by HOURS against a rule that
#            reads civil days;
#   * R8     an offset silently became a duplicate of its sibling;
#   * 2026-08-01, two loan cross-surface tests: a fixture promised a
#            "clean past" that the calendar decided;
#   * 2028-02-29, ``date.today().replace(year=+1)`` raises ValueError on
#            a leap day, and a hard-coded ``target_date`` of 2027-06-01
#            silently stops being in the future on 2027-06-01.
#
# The dates below are chosen for the boundaries that have actually
# produced defects, not for coverage theatre: a leap day, both sides of a
# year boundary, a month end, and the first of a month (where an
# installment falls on today).
#
# WEEKLY, not per-PR.  It is a full suite run per date; the per-PR clock
# gate lives in ci.yml (``TZ: Pacific/Kiritimati``) and costs nothing.

name: Calendar sweep

on:
  schedule:
    # 07:00 UTC every Monday -- 02:00/03:00 America/New_York, well clear
    # of the operator's bookkeeping sessions.
    - cron: "0 7 * * 1"
  # Manual trigger for a one-off check (a date not in the matrix can be
  # run locally: ``SHEKEL_FAKE_TODAY=<iso> ./scripts/test.sh``).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest

    strategy:
      # One red date must not cancel the others: the whole point is to
      # learn WHICH positions break.
      fail-fast: false
      matrix:
        fake_today:
          - "2028-02-29"  # leap day
          - "2026-12-31"  # last day of a year
          - "2027-01-01"  # first day of a year
          - "2026-11-30"  # month end
          - "2026-09-01"  # first of a month (installment falls on today)

    # The cluster is ``scripts/test.sh``'s, the one every run gets (ruling
    # bank_import:R-BI40): a private postgres from the baked template image
    # with the same durability, lock and statement settings a local run and
    # ci.yml's shards have.  A service container here once carried a third
    # configuration -- durability ON, every timeout off.
    env:
      SHEKEL_FAKE_TODAY: ${{ matrix.fake_today }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ``server_clock`` is deselected because those tests compare a
      # POSTGRES-stamped timestamp against a Python-derived one, and
      # time-machine moves Python's clock but not the database's -- so
      # under a faked date they fail by the offset between the two
      # clocks, whatever the code does.  That is a property of the
      # INSTRUMENT, not a licence to skip failures: every one of them
      # runs in the ordinary CI job.  A test earns the marker only after
      # its failure has been traced to the two clocks (see
      # docs/testing-standards.md), and "it fails at some dates but not
      # others" is NOT sufficient evidence -- one of them varies by date
      # and is still an artifact.
      #
      # ``-n logical`` is the runner's logical CPU count, which measured faster
      # there than ``pytest.ini``'s local ``-n 12`` (ci.yml step 7 carries
      # the figures) -- and the per-test timeout DEPENDS on it: ``pytest.ini``'s
      # 50 s is 3x the slowest test at this worker count (ruling
      # bank_import:R-BI41), and at ``-n 12`` the settled-bound family read
      # 24-27 s on the runner, under 2x of the cap.  ``CI`` is set on the
      # runner, which is what sanctions the wrapper using the runner's own
      # throwaway daemon.
      - name: Run tests as if today were ${{ matrix.fake_today }}
        run: ./scripts/test.sh -n logical --tb=short -q -m "not docker and not server_clock"
