# Shekel Budget App -- Tax law watch
#
# Fails every week from November 1 until next year's tax law is in the app,
# so GitHub emails the failure even when nobody is pushing (plan step
# salary:X-at-4; rulings salary:R-SAL74, R-SAL86, R-SAL87).
#
# WHY THIS EXISTS.  The tax law is one copy in the code (app/tax_law/), so a
# new year arrives only in a release that adds it, and nothing the app
# computes says a year is missing: a year the law lacks is priced on the
# latest earlier year's rules.  Forgetting is silent, so three alarms read
# one check (app/services/tax_law_alarm.py): the banner on every owner page
# from November 1, this run from November 1, and from December 1 the refusal
# -- ci.yml's ``tax-law`` job on every pull request, and docker-publish.yml's
# before any release image is built (ruling R-SAL88).
#
# WHAT IT CANNOT DO, stated because the other two alarms carry these cases:
#   * GitHub runs a schedule only from the DEFAULT branch, so this watch
#     exists from the release that brings it to main;
#   * in a public repository GitHub turns a schedule off after 60 days with
#     no repository activity -- the quiet stretch this watch is for.  The
#     in-app banner needs no pushes and no email, which is why ruling
#     R-SAL87 put it on every page;
#   * the failure email goes to whoever last edited the cron line below,
#     subject to that account's notification settings.
#
# It reads the REAL clock (scripts/check_tax_law.py docstring): it is not
# part of the suite, so the calendar sweep's faked date cannot reach it.

name: Tax law watch

on:
  schedule:
    # 12:23 UTC every Monday -- a morning email on the operator's clock, and
    # off the top of the hour, when GitHub may drop queued scheduled runs.
    - cron: "23 12 * * 1"
  # Manual trigger: run the check now.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The runtime requirements only: importing the law imports the ``app``
      # package, and the check needs nothing the dev tools add.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Is next year's tax law in? (fails from November 1)
        run: python scripts/check_tax_law.py notice
