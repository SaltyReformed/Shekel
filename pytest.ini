# Shekel Budget App -- Pytest Configuration

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show local variables in tracebacks.
#
# ``--ignore=tests/test_performance`` keeps the audit-trigger
# benchmarks out of THIS (parallel) run, and they are run instead by
# their own serial CI step -- ci.yml step 7b.  They PRINT a wall-clock
# ratio (one workload timed with and without the audit trigger) and
# assert nothing about time (ruling R-BAL144), and oversubscription
# inflates the ratio itself.  Measured 2026-08-28 on one tree: the
# regenerate benchmark, which wrote no audit row at all, reads 0.8-3.0%
# serially and 24.3-26.6% under ``-n 12``.  What the trigger DOES is
# graded in THIS run, by ``tests/test_integration/test_audit_trigger_work.py``.
#
# Run them the way CI does:
#   ./scripts/test.sh tests/test_performance -q -n 0 -p no:randomly --override-ini=addopts=
#
# --dist=loadgroup makes the ``@pytest.mark.xdist_group("name")``
# marker actually serialise tagged tests onto a single worker.  No
# effect on single-process runs (``--dist`` is only consulted when
# pytest-xdist's ``-n`` flag is set); under ``-n 12`` (the default
# below) it ensures the ``shekel_app_role`` cluster-role tests
# (``tests/test_models/test_audit_migration.py::TestLeastPrivilegeRole``)
# do not race two workers on ``CREATE ROLE shekel_app`` /
# ``DROP ROLE shekel_app``.  Unmarked tests continue to load-balance
# across workers exactly as ``--dist=load`` would distribute them.
#
# -n 12 distributes tests across 12 pytest-xdist workers by default.
# Empirically (Phase 4.5 profiling on a 24-core host) -n 12 ran a
# 1,756-test batch in 79s vs 561s sequential -- a 7x speedup with
# ~59% scaling efficiency.  Going higher (-n 16, -n 24) keeps adding
# workers but the marginal gain falls off a cliff: PostgreSQL's
# cluster-wide WAL/fsync pipeline is the serialised resource, not
# CPU (24 cores idle during -n 16 runs).  -n 12 is the sweet spot
# where most of the parallelism win is captured without the thrash
# risk of saturating the WAL queue.  Override with ``-n 0`` for
# single-process debugging or ``-n auto`` for the absolute fastest
# run on a quiet box.
#
# **-n 12 is the LOCAL default.  CI's shards pass ``-n logical`` -- the
# runner's logical CPU count, 4 -- because on the runner fewer workers were
# measured FASTER** (plan step bank_import:X-gy, ruling R-BI38, ledger
# BI-496).  The hosted runner is CPU-bound: 4 vCPUs that are 2 physical
# cores with SMT.  A matched A/B on it, 2026-09-22 (draft PR #447, run
# 35806759874), the same 1,230-test slice through scripts/test.sh's
# cluster, each arm on the same runner, two runners:
#
#     -n 12    285.1 s    310.4 s
#     -n  6    265.8 s    276.5 s
#     -n  4    259.1 s    272.6 s
#     -n  3    301.4 s    311.2 s
#
# That overturns the A/B this block used to carry (-n 4 costing 52% more
# than -n 12), which was measured on this host under ``taskset`` and, as
# it said itself, constrained pytest but not the database or the disk --
# so it never graded the clock it governed.  On the runner a test's own
# wall clock scales with the worker count: setup plus body averaged
# 0.79 s at -n 4 and 2.46 s at -n 12 on one runner, and that per-test
# figure is what the timeout below measures.
addopts = -v --tb=short --ignore=tests/test_performance --dist=loadgroup -n 12

# Per-test timeout (seconds): a HANG detector, so it sits well above
# the slowest honest test on the slowest runner -- and that runner is
# CI's, never this box.  It covers setup + call + teardown.  Measured
# 2026-09-22 on the hosted runner under CI's six-shard layout at 4
# workers a runner (run 35808935180, five of six shards on the slowest CPU
# the fleet drew, an AMD EPYC 7763): the slowest test was
# ``test_pay_grid_month_kinds.py``'s semi-monthly listing at a 16.16 s
# call, and the settled-bound family (51 real door calls a case)
# 5.1-8.6 s -- down from 24-27 s under the single job's ``-n 12`` the
# same week (run 35784406699).  50 s is 3x the slowest, the same 3x this
# cap was sized by at 90 s against the 30 s one CI's ``-n 12`` crossed
# (ruling R-BI41), and the ruling's own re-check against the pre-commit
# dress rehearsal of the six-shard workflow (run 35815066395) read a
# slowest of 15.56 s, so the cap stood.  A LOCAL --durations figure is
# never the basis for this number: CI runs a test slower than this host
# even without oversubscription.  The rule between this and the split
# above: a test whose work is FIXED and honest (51 acts) takes the cap;
# one whose work scales with a table (the route sweep) is split.  The dated table:
# docs/testing-standards.md, Test Run Guidelines; the finding: ledger
# BI-496 (bank_import:X-gy).
timeout = 50

# Custom marker registration.  Without this entry, pytest emits a
# PytestUnknownMarkWarning for every test carrying the marker, and a
# future ``--strict-markers`` flag would treat the marker as an
# error.  ``xdist_group`` is provided by pytest-xdist; ``slow_fixture``
# is project-local (defined here for opt-in exclusion from the
# fixture profile harness in
# ``docs/audits/test_improvements/test-performance-implementation-plan.md``).
markers =
    xdist_group(name): serialise all tests tagged with the same
        name onto a single pytest-xdist worker.  Required only for
        tests that mutate cluster-scoped PostgreSQL state (roles,
        replication slots, ...) which cannot be safely concurrent
        across the per-worker database clones.
    slow_fixture: mark a test whose own setup pays an above-normal
        cost (heavy seed data, expensive parametrisation) so the
        fixture profile harness can exclude it from per-step
        averages.  Reserved for future use; the Phase 0 harness
        currently treats every test equally and computes averages
        over the full sample.  See
        docs/audits/test_improvements/test-performance-implementation-plan.md.
    docker: test stands up real containers or drives ``docker run`` /
        ``docker compose`` against the daemon.  Excluded from routine
        local runs by scripts/test.sh (which defaults to
        ``-m "not docker"``) so they never touch the production Docker
        daemon the homelab stack + wud/cadvisor/alloy share.  CI's shards
        pass ``-m ""`` to the wrapper, so they still run them.  See
        docs/test-harness-isolation.md.
    seeded_start_state(name): this test starts from the named world rather
        than from an empty database.  The world is built ONCE per xdist
        worker and frozen into a snapshot database; the test still gets its
        own private clone of it, so per-test isolation is unchanged and only
        the content it starts with differs.  Registered by the module that
        defines the world, via ``tests/conftest.py::register_seeded_state``;
        read the block comment there before adding one.  A world may hold no
        state finer-grained than the SESSION it is built in -- it may read
        ``display_today()``, which cannot move far enough within one session
        to matter, and may not depend on the instant of its own construction,
        because it is built once and read by every test that declares it.
        Plan step balance:X-be-2.
    server_clock: the test compares a POSTGRES-stamped timestamp against a
        Python-derived one, so it cannot run under the calendar sweep
        (``SHEKEL_FAKE_TODAY``).  ``created_at`` / ``updated_at`` are
        ``server_default=db.func.now()`` and ``paid_at`` is ``db.func.now()``;
        time-machine moves Python's clock and cannot move the database's, so
        under a faked date these rows carry the REAL instant and any comparison
        against a faked one is off by the offset.  Two of them assert the
        database clock deliberately (the ``CURRENT_DATE`` server default, the
        audit trigger's ``executed_at``).  **This marker is a statement about
        the INSTRUMENT, not a licence to skip a failure** -- the sweep job
        deselects it, every other run includes it, and a test only earns it
        after its failure has been traced to the two clocks.  See
        docs/testing-standards.md.

# Filter deprecation warnings from dependencies.
filterwarnings =
    ignore::DeprecationWarning:flask_sqlalchemy.*
